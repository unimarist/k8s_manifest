apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/env: production
  app.kubernetes.io/managed-by: kustomize
namespace: production

configMapGenerator:
- literals:
  - ENV=production
  name: web-env-config-prd

images:
- digest: sha256:e049f8394b40581fef49d00ca4ee3481155c217bd0bb6f0b6807cd497deaa70b
  name: ___IMAGE_URL___@___IMAGE_DIGEST___
  newName: ghcr.io/unimarist/ankiba-web

    # 1. 自身のmetadataラベル
    # 2. specのセレクタ
    # 3. Podテンプレートのラベル

    # delimiterとindexのルールはすべて同じため、上はまとめて設定可能

replacements:
- source:
    fieldPath: data.ENV
    kind: ConfigMap
    name: web-env-config-prd
  targets:
  - fieldPaths:
    - metadata.labels.role
    - spec.selector.matchLabels.role
    - spec.template.metadata.labels.role
    - spec.template.spec.containers.[name=ankiba-web-ENV_PLACEHOLDER].name
    options:
      delimiter: '-'
      index: 2
    select:
      kind: Deployment
      name: ankiba-web-deployment
  - fieldPaths:
    - metadata.labels.role
    - spec.selector.role
    options:
      delimiter: '-'
      index: 2
    select:
      kind: Service
      name: ankiba-service-web

resources:
- ../../base

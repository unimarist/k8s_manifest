apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/env: staging
  app.kubernetes.io/managed-by: kustomize
namespace: staging

resources:
- ../../base

patches:
- target:
    kind: Ingress
    name: ankiba-ingress
  patch: |-
    - op: add
      path: /spec/rules/0/host
      value: ankiba-staging.unimarist.com

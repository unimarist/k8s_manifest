apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/env: production
  app.kubernetes.io/managed-by: kustomize
namespace: infra

resources:
- ../../base

patches:
  - path: patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: staging-ankiba # ★ 置換対象（ベース側の名前）を明示
      namespace: infra

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-ankiba
  namespace: infra
  labels:
    app: ankiba
    environment: staging
spec:
  destination:
    namespace: staging
    server: https://10.0.1.185:6443 # private ip for common-control-plane-node
  project: ankiba
  source:
    kustomize:
    path: ankiba/overlays/staging
    repoURL: https://github.com/unimarist/k8s_manifest.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true 
      - CreateNamespace=true
